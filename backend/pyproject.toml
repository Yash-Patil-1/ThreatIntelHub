[project]
name = "threatintelhub-backend"
version = "0.1.0"
description = "ThreatIntelHub API + worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "apscheduler>=3.10,<4",
    "pydantic[email]>=2.7",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "httpx>=0.27",
    "weasyprint>=62",
    "jinja2>=3.1",
    "yara-python>=4.5",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.30",
    "respx>=0.22",
    "aiosqlite>=0.22.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
